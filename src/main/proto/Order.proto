syntax = "proto3";

package se.vermiculus.benchmark.serialization.model;

option java_package = "se.vermiculus.benchmark.serialization.model.proto";
option java_multiple_files = true;

message Order {
  string id = 1;
  Customer customer = 2;
  repeated OrderLine lines = 3;
  OrderStatus status = 4;
  // LocalDate encoded as the epoch day (days since 1970-01-01).
  int32 created = 5;
  Address shippingAddress = 6;
  string notes = 7;
}

message Customer {
  int64 id = 1;
  string firstName = 2;
  string lastName = 3;
  string email = 4;
  // LocalDate encoded as the epoch day (days since 1970-01-01).
  int32 dateOfBirth = 5;
  bool vip = 6;
  repeated Address addresses = 7;
}

message Address {
  string street = 1;
  string city = 2;
  string zip = 3;
  string country = 4;
}

message OrderLine {
  Product product = 1;
  int32 quantity = 2;
  // BigDecimal serialized as its string representation to preserve precision.
  string unitPrice = 3;
  double discount = 4;
}

message Product {
  string sku = 1;
  string name = 2;
  string description = 3;
  Category category = 4;
  // BigDecimal serialized as its string representation to preserve precision.
  string price = 5;
  int32 weightGrams = 6;
  repeated string tags = 7;
}

message Category {
  int64 id = 1;
  string name = 2;
  Category parent = 3;
}

enum OrderStatus {
  NEW = 0;
  PAID = 1;
  PICKING = 2;
  SHIPPED = 3;
  DELIVERED = 4;
  CANCELLED = 5;
}
